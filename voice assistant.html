<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اردو وائس اسسٹنٹ - Urdu Voice Assistant</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      direction: rtl;
      text-align: right;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    #status {
      text-align: center;
      font-size: 1.3rem;
      margin: 15px 0;
      min-height: 40px;
    }
    #output {
      background: rgba(255,255,255,0.15);
      padding: 20px;
      border-radius: 12px;
      min-height: 120px;
      font-size: 1.2rem;
      line-height: 1.6;
      margin-top: 20px;
      direction: ltr;
      text-align: left;
    }
    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 25px 0;
    }
    button {
      padding: 14px 32px;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }
    #startBtn {
      background: #00c853;
      color: white;
    }
    #stopBtn {
      background: #d50000;
      color: white;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
    #langSelect {
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>اردو وائس اسسٹنٹ</h1>
  <p style="text-align:center; opacity:0.9;">بولو یا لکھو — میں انگریزی اور دوسری زبانوں میں ترجمہ کروں گا</p>

  <div id="status">میک تیار ہے... "اسٹارٹ" دبائیں</div>

  <div class="buttons">
    <button id="startBtn">🎤 اسٹارٹ / دوبارہ شروع</button>
    <button id="stopBtn">⏹ روک دیں</button>
  </div>

  <div style="text-align:center; margin:20px 0;">
    <label>ترجمہ جس زبان میں چاہیے: </label>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="hi">हिन्दी</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="ja">日本語</option>
      <option value="zh-CN">中文</option>
    </select>
  </div>

  <div id="output">
    نتیجہ یہاں آئے گا...
  </div>
</div>

<script>
// =============================================
//  بنیادی ترجمہ فنکشن (Google Translate URL hack)
// =============================================
function translateText(text, targetLang = 'en') {
  if (!text.trim()) return Promise.resolve("کوئی متن نہیں بولا گیا");

  const url = `https://translate.google.com/m?hl=en&sl=auto&tl=${targetLang}&q=${encodeURIComponent(text)}`;
  
  return fetch(url)
    .then(r => r.text())
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      const result = doc.querySelector('.result-container')?.innerText || 
                     "ترجمہ نہیں ہو سکا (شاید نیٹ سلو ہے)";
      return result.trim();
    })
    .catch(err => {
      console.error(err);
      return "ترجمہ کے دوران خرابی ہوئی 😔";
    });
}

// =============================================
//  وائس ریکگنیشن
// =============================================
const status = document.getElementById('status');
const output = document.getElementById('output');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const langSelect = document.getElementById('langSelect');

let recognition = null;
let isListening = false;

function initRecognition() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    status.innerHTML = "آپ کا براؤزر وائس ریکگنیشن سپورٹ نہیں کرتا 😢<br>Chrome استعمال کریں";
    return false;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  
  recognition.continuous = false;        // ایک جملہ سن کر رک جائے
  recognition.interimResults = false;
  recognition.lang = 'ur-PK';            // اردو پاکستان

  recognition.onstart = () => {
    isListening = true;
    status.innerHTML = "سن رہا ہوں... بولو 😊";
    startBtn.textContent = "🎤 سن رہا ہوں...";
  };

  recognition.onresult = async (event) => {
    const spokenText = event.results[0][0].transcript.trim();
    status.innerHTML = `آپ نے کہا: <b>${spokenText}</b>`;
    
    const targetLang = langSelect.value;
    output.innerHTML = `ترجمہ ہو رہا ہے (${targetLang}) ...`;

    const translated = await translateText(spokenText, targetLang);
    
    output.innerHTML = `
      <b>آپ نے کہا:</b> ${spokenText}<br><br>
      <b>${targetLang.toUpperCase()} میں ترجمہ:</b><br>
      ${translated}
    `;
  };

  recognition.onerror = (event) => {
    status.innerHTML = "خرابی: " + event.error;
    isListening = false;
    startBtn.textContent = "🎤 اسٹارٹ / دوبارہ شروع";
  };

  recognition.onend = () => {
    isListening = false;
    startBtn.textContent = "🎤 اسٹارٹ / دوبارہ شروع";
    status.innerHTML = "سننا بند کر دیا گیا۔ دوبارہ شروع کریں";
  };

  return true;
}

// بٹن ایکشن
startBtn.onclick = () => {
  if (!recognition && !initRecognition()) return;
  
  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
  }
};

stopBtn.onclick = () => {
  if (recognition && isListening) {
    recognition.stop();
  }
};

</script>
</body>
</html>
